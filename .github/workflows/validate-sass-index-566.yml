name: Validate Sass index entrypoints

on:
  push:
    branches:
      - automation/validate-sass-index-566
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out clean contribution
        run: git checkout feat/sass-index-entrypoints-566

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and build package
        run: |
          npm ci
          npm run lint
          npm run prepack

          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          package_archive=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' -print -quit)
          printf '%s\n' "$package_archive" > "$RUNNER_TEMP/package-archive-path"

      - name: Test root Sass shim precedence
        run: |
          package_archive=$(cat "$RUNNER_TEMP/package-archive-path")
          consumer="$RUNNER_TEMP/consumer"
          package="$consumer/node_modules/nhsapp-frontend"
          mkdir -p "$package"
          tar -xzf "$package_archive" -C "$package" --strip-components=1
          ln -s "$GITHUB_WORKSPACE/node_modules/nhsuk-frontend" \
            "$consumer/node_modules/nhsuk-frontend"

          cat > "$consumer/all.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/all";
          SCSS
          cat > "$consumer/short.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp";
          SCSS

          sass_bin="$GITHUB_WORKSPACE/node_modules/.bin/sass"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/all.scss" "$consumer/all.css"

          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/short.scss" "$consumer/no-shim.css"

          cat > "$package/dist/_nhsapp.scss" <<'SCSS'
          @import "nhsapp/index";
          SCSS
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/short.scss" "$consumer/partial-shim.css"
          rm "$package/dist/_nhsapp.scss"

          cat > "$package/dist/nhsapp.scss" <<'SCSS'
          @import "nhsapp/index";
          SCSS
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/short.scss" "$consumer/regular-shim.css"
          rm "$package/dist/nhsapp.scss"

          CONSUMER="$consumer" python <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["CONSUMER"])
          baseline = (root / "all.css").read_text()
          for name in ("no-shim", "partial-shim", "regular-shim"):
              content = (root / f"{name}.css").read_text()
              print(
                  f"{name}: equal={content == baseline} len={len(content)} "
                  f"sha={hashlib.sha256(content.encode()).hexdigest()}"
              )
          PY

          ! cmp -s "$consumer/all.css" "$consumer/no-shim.css"
          cmp "$consumer/all.css" "$consumer/partial-shim.css"
          cmp "$consumer/all.css" "$consumer/regular-shim.css"

      - name: Confirm clean contribution
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
