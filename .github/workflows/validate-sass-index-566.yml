name: Validate Sass index entrypoints

on:
  push:
    branches:
      - automation/validate-sass-index-566
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out clean contribution
        run: git checkout feat/sass-index-entrypoints-566

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and build package
        run: |
          npm ci
          npm run lint
          npm run docs:build
          npm run prepack

          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          package_archive=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' -print -quit)
          printf '%s\n' "$package_archive" > "$RUNNER_TEMP/package-archive-path"

      - name: Diagnose Sass resolver precedence
        run: |
          package_archive=$(cat "$RUNNER_TEMP/package-archive-path")
          consumer="$RUNNER_TEMP/consumer"
          package="$consumer/node_modules/nhsapp-frontend"
          mkdir -p "$package"
          tar -xzf "$package_archive" -C "$package" --strip-components=1
          ln -s "$GITHUB_WORKSPACE/node_modules/nhsuk-frontend" \
            "$consumer/node_modules/nhsuk-frontend"

          cat > "$consumer/all.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/all";
          SCSS

          cat > "$consumer/directory.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp";
          SCSS

          cat > "$consumer/directory-slash.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/";
          SCSS

          cat > "$consumer/explicit-index.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/index";
          SCSS

          sass_bin="$GITHUB_WORKSPACE/node_modules/.bin/sass"
          for name in all directory directory-slash explicit-index; do
            set +e
            "$sass_bin" --style=compressed --no-source-map \
              --load-path="$consumer/node_modules" \
              "$consumer/$name.scss" "$consumer/$name.css" \
              >"$consumer/$name.stdout" 2>"$consumer/$name.stderr"
            status=$?
            set -e
            printf '%s=%s\n' "$name" "$status"
            cat "$consumer/$name.stderr"
          done

          CONSUMER="$consumer" PACKAGE="$package" python <<'PY'
          import hashlib
          import os
          from pathlib import Path

          consumer = Path(os.environ["CONSUMER"])
          package = Path(os.environ["PACKAGE"])
          files = {
              "all": consumer / "all.css",
              "directory": consumer / "directory.css",
              "directory-slash": consumer / "directory-slash.css",
              "explicit-index": consumer / "explicit-index.css",
              "precompiled": package / "dist/nhsapp.css",
          }

          contents = {}
          for name, path in files.items():
              if not path.exists():
                  print(f"{name}: missing")
                  continue
              content = path.read_text()
              contents[name] = content
              print(
                  f"{name}: len={len(content)} "
                  f"sha={hashlib.sha256(content.encode()).hexdigest()} "
                  f"has_import={'@import' in content} "
                  f"has_card={'.nhsapp-card' in content} "
                  f"prefix={content[:120]!r}"
              )

          for left in contents:
              for right in contents:
                  if left < right:
                      print(f"equal[{left},{right}]={contents[left] == contents[right]}")
          PY

      - name: Confirm clean contribution
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
