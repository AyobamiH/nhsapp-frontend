name: Validate Sass index entrypoints

on:
  push:
    branches:
      - automation/validate-sass-index-566
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out clean contribution
        run: git checkout feat/sass-index-entrypoints-566

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build documentation
        run: |
          npm run docs:build
          grep -R -q 'node_modules/nhsapp-frontend/dist/nhsapp' dist/docs
          grep -R -q 'node_modules/nhsapp-frontend/dist/nhsapp/components/button' dist/docs

      - name: Build and inspect npm package
        run: |
          npm run prepack
          test -f dist/_nhsapp.scss
          test -f dist/nhsapp/index.scss
          test ! -e dist/nhsapp/_nhsapp.scss
          cmp src/_nhsapp.scss dist/_nhsapp.scss
          cmp src/index.scss dist/nhsapp/index.scss

          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          package_archive=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$package_archive"
          tar -tzf "$package_archive" > "$RUNNER_TEMP/package-contents"
          grep -qx 'package/dist/_nhsapp.scss' "$RUNNER_TEMP/package-contents"
          grep -qx 'package/dist/nhsapp/index.scss' "$RUNNER_TEMP/package-contents"
          printf '%s\n' "$package_archive" > "$RUNNER_TEMP/package-archive-path"

      - name: Compile documented Sass imports from packed package
        run: |
          package_archive=$(cat "$RUNNER_TEMP/package-archive-path")
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/node_modules/nhsapp-frontend"
          tar -xzf "$package_archive" \
            -C "$consumer/node_modules/nhsapp-frontend" \
            --strip-components=1
          ln -s "$GITHUB_WORKSPACE/node_modules/nhsuk-frontend" \
            "$consumer/node_modules/nhsuk-frontend"

          cat > "$consumer/all-existing.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/all";
          SCSS

          cat > "$consumer/all-short.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp";
          SCSS

          cat > "$consumer/button-short.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/components/button";
          SCSS

          sass_bin="$GITHUB_WORKSPACE/node_modules/.bin/sass"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/all-existing.scss" "$consumer/all-existing.css"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/all-short.scss" "$consumer/all-short.css" \
            2>"$consumer/all-short.stderr"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$consumer/node_modules" \
            "$consumer/button-short.scss" "$consumer/button-short.css"

          cmp "$consumer/all-existing.css" "$consumer/all-short.css"
          grep -q 'dist/_nhsapp.scss' "$consumer/all-short.stderr"
          for selector in '.nhsapp-badge' '.nhsapp-button' '.nhsapp-card' '.nhsapp-timeline'; do
            grep -q "$selector" "$consumer/all-short.css"
          done
          grep -q '.nhsapp-button' "$consumer/button-short.css"

      - name: Prove current upstream does not resolve the shorthand to Sass source
        run: |
          base="$RUNNER_TEMP/nhsapp-frontend-566-base"
          git worktree add --detach "$base" \
            775518abf9f7a88e2fdd4a4c28048ca8c3f0b639
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base/node_modules"

          (
            cd "$base"
            "$GITHUB_WORKSPACE/node_modules/.bin/gulp" bundle
          )

          test ! -e "$base/dist/_nhsapp.scss"
          test ! -e "$base/dist/nhsapp/index.scss"

          base_consumer="$RUNNER_TEMP/base-consumer"
          mkdir -p "$base_consumer/node_modules"
          ln -s "$base" "$base_consumer/node_modules/nhsapp-frontend"
          ln -s "$GITHUB_WORKSPACE/node_modules/nhsuk-frontend" \
            "$base_consumer/node_modules/nhsuk-frontend"

          cat > "$base_consumer/all-existing.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp/all";
          SCSS
          cat > "$base_consumer/all-short.scss" <<'SCSS'
          @import "node_modules/nhsapp-frontend/dist/nhsapp";
          SCSS

          sass_bin="$GITHUB_WORKSPACE/node_modules/.bin/sass"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$base_consumer/node_modules" \
            "$base_consumer/all-existing.scss" \
            "$base_consumer/all-existing.css"
          "$sass_bin" --style=compressed --no-source-map \
            --load-path="$base_consumer/node_modules" \
            "$base_consumer/all-short.scss" \
            "$base_consumer/all-short.css"

          ! cmp -s \
            "$base_consumer/all-existing.css" \
            "$base_consumer/all-short.css"

          rm "$base/node_modules"
          git worktree remove --force "$base"

      - name: Build and inspect release archive
        run: |
          npm run release
          archive="dist/nhsapp-frontend-$(node -p "require('./package.json').version").zip"
          test -f "$archive"

          release_dir="$RUNNER_TEMP/release-archive"
          mkdir -p "$release_dir"
          unzip -q "$archive" -d "$release_dir"
          find "$release_dir" -type f -print | sort

          shim=$(find "$release_dir" -type f -name '_nhsapp.scss' -print -quit)
          index=$(find "$release_dir" -type f -name 'index.scss' -print -quit)
          test -n "$shim"
          test -n "$index"
          cmp src/_nhsapp.scss "$shim"
          cmp src/index.scss "$index"

      - name: Confirm clean contribution
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
