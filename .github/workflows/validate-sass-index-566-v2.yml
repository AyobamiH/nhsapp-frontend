name: Validate Sass index entrypoint issue 566 v2

on:
  push:
    branches:
      - automation/validate-sass-index-566-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/sass-index-entrypoints-566
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run docs:build

      - name: Validate packed-package imports
        shell: bash
        run: |
          set -euo pipefail
          npm run prepack
          package_file=$(npm pack --ignore-scripts --silent)
          package_path="$GITHUB_WORKSPACE/$package_file"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install "$package_path"
          cd "$GITHUB_WORKSPACE"

          test -f "$consumer/node_modules/nhsapp-frontend/dist/_nhsapp.scss"
          test -f "$consumer/node_modules/nhsapp-frontend/dist/nhsapp/index.scss"
          test -d "$consumer/node_modules/nhsuk-frontend"

          printf '@import "nhsapp-frontend/dist/nhsapp";\n' > "$consumer/all.scss"
          printf '@import "nhsapp-frontend/dist/nhsapp/components/button";\n' > "$consumer/button.scss"
          printf '@import "nhsapp-frontend/dist/nhsapp/all";\n' > "$consumer/legacy.scss"

          npx sass --no-source-map --load-path="$consumer/node_modules" --style=compressed \
            "$consumer/all.scss" "$consumer/all.css"
          npx sass --no-source-map --load-path="$consumer/node_modules" --style=compressed \
            "$consumer/button.scss" "$consumer/button.css"
          npx sass --no-source-map --load-path="$consumer/node_modules" --style=compressed \
            "$consumer/legacy.scss" "$consumer/legacy.css"

          cmp "$consumer/all.css" "$consumer/legacy.css"
          grep -Fq '.nhsapp-button' "$consumer/button.css"

      - name: Validate documentation and release archive
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '@import "node_modules/nhsapp-frontend/' docs/get-started/installing-with-npm.md
          grep -Fq '@import "nhsapp-frontend/dist/nhsapp";' docs/get-started/installing-with-npm.md
          grep -Fq '@import "nhsapp-frontend/dist/nhsapp/components/button";' docs/get-started/installing-with-npm.md
          grep -Fq -- '--load-path=node_modules' docs/get-started/installing-with-npm.md
          npm run release
          release_zip=$(find dist -maxdepth 1 -name 'nhsapp-frontend-*.zip' -print -quit)
          test -n "$release_zip"
          unzip -Z1 "$release_zip" > "$RUNNER_TEMP/release-contents.txt"
          grep -Fq '_nhsapp.scss' "$RUNNER_TEMP/release-contents.txt"
          grep -Fq 'nhsapp/index.scss' "$RUNNER_TEMP/release-contents.txt"
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
